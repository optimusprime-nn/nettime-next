name: Windows build and tests
# Only trusted revisions reach the shared, persistent self-hosted runner: pushes
# to main and manual dispatch (which needs write access). No pull_request
# trigger, so fork code never runs there, even after approval.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Legacy Python build, unit tests and packaging only. The shared self-hosted
# build VM is persistent and runs jobs as a standard user, so the installed
# service lifecycle test stays off it until a disposable, repository-only
# Windows VM exists for it.
jobs:
  windows:
    if: github.repository == 'optimusprime-nn/nettime-next'
    runs-on: [self-hosted, windows, msvc]
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Create build environment
        run: |
          # setup-python would install system-wide, which the runner's standard account cannot do.
          py -3.11 -m venv "$env:RUNNER_TEMP/venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Join-Path $env:RUNNER_TEMP 'venv\Scripts' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install pinned build dependencies
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install verified Inno Setup compiler
        run: |
          $compiler = & ./scripts/Get-InnoSetup.ps1 -Destination "$env:RUNNER_TEMP/nettime-inno"
          "NETTIME_ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test and package installer
        run: |
          python build.py --iscc "$env:NETTIME_ISCC"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: NetTimeNext-Windows-x64
          path: |
            dist/*Setup-x64.exe
            dist/build-manifest.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
