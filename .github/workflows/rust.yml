name: Windows release checks
on:
  workflow_dispatch:
  push:
    paths: ['native/**', '.github/workflows/rust.yml', 'desktop.manifest', 'nettime.ico']
  pull_request:
    paths: ['native/**', '.github/workflows/rust.yml', 'desktop.manifest', 'nettime.ico']
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package Windows release
        run: |
          $compiler = & ./scripts/Get-InnoSetup.ps1 -Destination "$env:RUNNER_TEMP/nettime-inno"
          python ./native/package.py --iscc $compiler
      - name: Native static analysis
        working-directory: native
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Native installed service lifecycle
        run: ./native/test-installed.ps1 -Installer ./dist/NetTimeNext-1.0.1-Setup-x64.exe
      - name: Native desktop launch check
        run: |
          $desktop = Start-Process ./native/target/release/NetTimeNextNative.exe -ArgumentList '--smoke-ui --software-rendering' -Wait -PassThru
          if ($desktop.ExitCode -ne 0) { exit $desktop.ExitCode }
      - uses: actions/upload-artifact@v4
        with:
          name: NetTimeNext-Windows-x64
          path: |
            native/target/release/NetTimeNextNative*.exe
            dist/NetTimeNext-1.0.1-Setup-x64.exe
            dist/rust-clock-response.json
            dist/rust-tray-lifecycle.json
            dist/build-manifest.json
            dist/SHA256SUMS.txt
