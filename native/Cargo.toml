[package]
name = "nettime-next-native"
version = "0.4.0-dev"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.38", features = ["bundled"] }
getrandom = "0.3"
hex = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
aes-siv = "0.7"
sha2 = "0.10"
zeroize = "1.8"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
egui_plot = "0.34"
tray-icon = "0.26"
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Services"] }

[[bin]]
name = "NetTimeNextNative"
path = "src/main.rs"

[[bin]]
name = "NetTimeNextNativeService"
path = "src/service_main.rs"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
