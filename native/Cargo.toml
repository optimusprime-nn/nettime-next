[package]
name = "nettime-next-native"
version = "0.4.4-preview"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.38", features = ["bundled", "functions", "hooks"] }
flate2 = "1.1"
getrandom = "0.3"
hex = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
aes-siv = "0.7"
sha2 = "0.10"
zeroize = "1.8"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu"] }
wgpu = { version = "27.0.1", default-features = false, features = ["std", "dx12", "wgsl"] }
egui_plot = "0.34"
tray-icon = { version = "0.26", default-features = false }
raw-window-handle = "0.6"
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Authentication_Identity", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Services", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }

[[bin]]
name = "NetTimeNextNative"
path = "src/main.rs"

[[bin]]
name = "NetTimeNextNativeService"
path = "src/service_main.rs"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
